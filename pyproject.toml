[build-system]
requires = ["setuptools>=69", "wheel", "build", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tachyon-dist-tools"
description = "Tools for CI/CD pipelines"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Andrew Zenk", email = "andrew.zenk@particle.io" }]
license = { text = "Apache-2.0" }

# Tell setuptools we'll provide deps dynamically (from requirements.txt)
dynamic = ["dependencies", "version"]

[project.optional-dependencies]
dev = [
  "setuptools-scm",
  "build",
  "setuptools",
  "pytest>=8",           # test runner (will run your unittest tests too)
  "coverage[toml]>=7.6", # coverage
  "ruff>=0.6",           # linter
]

[project.scripts]
resolve-version = "tachyon_dist_tools.resolve_version:main"
update-published-metadata = "tachyon_dist_tools.update_published_metadata:main"
json-validator = "tachyon_dist_tools.json_validator:main"
s3-updater = "tachyon_dist_tools.s3_updater:main"
gh-note-builder = "tachyon_dist_tools.gh_note_builder:main"

[tool.setuptools.package-data]
"tachyon_dist_tools.schema" = ["*.json"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.pytest.ini_options]
testpaths = ["tests"]
# Pytest will discover unittest.TestCase tests automatically
addopts = "-q"

[tool.setuptools.packages.find]
exclude = ["tests", "tests.*", "*.tests", "*.tests.*"]

[tool.coverage.run]
branch = true
source = ["tachyon_dist_tools"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.setuptools_scm]
