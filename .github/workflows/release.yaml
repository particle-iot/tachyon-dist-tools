name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: make install

      - name: Resolve version and create tag
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          source .venv/bin/activate
          VERSION=$(tachyon-resolve-version --build-type release --create-tag)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VERSION"

      - name: Build wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.version.outputs.version }}
        run: |
          source .venv/bin/activate
          python -m build --wheel

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ steps.version.outputs.version }} dist/*.whl \
            --title "${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Configure AWS credentials for schema publishing
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: tachyon-dist-tools-release-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Publish schema
        env:
          S3_BUCKET: ${{ secrets.LINUX_DIST_S3_BUCKET }}
        run: |
          aws s3 sync tachyon_dist_tools/schema/ s3://$S3_BUCKET/schema/ --exclude "*" --include "*.json"

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ secrets.LINUX_DIST_CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation --distribution-id $DISTRIBUTION_ID --paths "/schema/*"
